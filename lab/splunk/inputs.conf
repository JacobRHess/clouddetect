# HEC endpoint the harness pushes fixtures to. The dev token is intentionally
# well-known; this lab is localhost only and ships no real data. No `indexes`
# restriction, so the harness can target the clouddetect index by envelope.
[http]
disabled = 0

[http://clouddetect]
disabled = 0
token = 00000000-0000-0000-0000-000000000000
index = clouddetect

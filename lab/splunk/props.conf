# The fixtures arrive as JSON over HEC. Without KV_MODE=json on these
# sourcetypes the nested CloudTrail and Okta fields are not searchable and
# every detection comes back empty - a silent false pass on the benign half
# and a false fail on the alert half.
[aws:cloudtrail]
KV_MODE = json

[okta:system]
KV_MODE = json

[azure:entra]
KV_MODE = json

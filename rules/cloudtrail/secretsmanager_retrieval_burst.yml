title: Secrets Manager retrieval (base)
name: secretsmanager_get
status: experimental
description: A single Secrets Manager GetSecretValue call.
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName: GetSecretValue
  condition: selection
---
title: Secrets Manager mass retrieval
id: 0c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
status: experimental
description: >
  One principal pulled ten or more secrets from Secrets Manager inside ten
  minutes. Applications read their own one or two secrets steadily; a single
  identity sweeping many of them in a short window is collection, the cloud
  equivalent of dumping the password vault.
references:
  - https://attack.mitre.org/techniques/T1555/
correlation:
  type: event_count
  rules:
    - secretsmanager_get
  group-by:
    - userIdentity.arn
  timespan: 10m
  condition:
    gte: 10
falsepositives:
  - A service that legitimately loads many secrets at boot. Scope out its role
    ARN, or raise the threshold for that principal.
level: high
tags:
  - attack.credential-access
  - attack.t1555

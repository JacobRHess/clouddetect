title: Entra ID service principal credential added
id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
status: experimental
description: >
  A credential (client secret or certificate) was added to a service principal
  in Entra ID. Adding a secret to an existing privileged app is a stealthy
  persistence move: the attacker can then authenticate as that app, with its
  permissions, without touching any user account or MFA.
references:
  - https://attack.mitre.org/techniques/T1098/001/
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    category: ApplicationManagement
    activityDisplayName: Add service principal credentials
    result: success
  condition: selection
falsepositives:
  - A CI pipeline or admin rotating an application secret through an approved
    process. Scope out the known automation principals.
level: high
tags:
  - attack.persistence
  - attack.t1098.001

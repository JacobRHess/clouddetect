name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline gate: lint, types, security, and the manifest/conversion unit tests.
  # No engines. Fails fast before the heavier job boots Splunk and OpenSearch.
  static:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, not a moving tag,
      # so a compromised or retagged release cannot change what runs.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Sync from the lockfile
        run: uv sync --extra dev --frozen
      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Security scan (source)
        run: uv run bandit -c pyproject.toml -q -r src
      - name: Vulnerable dependency scan
        # --skip-editable so the project itself is not audited as an unpublished
        # dist; deps are still scanned. CVE-2025-69872 is in diskcache, pulled
        # transitively by pySigma, with no fixed release. pySigma only converts
        # this repo's own rules, so no untrusted input reaches diskcache.
        # Documented in SECURITY.md; drop the ignore when a fix ships.
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2025-69872
      - name: Unit tests with coverage gate
        run: uv run pytest -q --cov

  # The real loop: boot Splunk and OpenSearch, replay every fixture through both,
  # and fail if any detection does not fire (or stay silent) as the manifest
  # declares. This proves the rules are portable, not just that they parse.
  validate:
    runs-on: ubuntu-latest
    needs: static
    env:
      CD_SPLUNK_PASSWORD: clouddetect_dev_2026
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --extra dev --frozen

      - name: Start OpenSearch
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name opensearch \
            -p 9200:9200 \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" \
            opensearchproject/opensearch:2.18.0

      - name: Start Splunk
        shell: bash
        run: |
          set -euo pipefail
          # Mount the lab confs as an app's local dir so the image's first-boot
          # provisioning (which owns system/local) is not blocked by read-only
          # files. This enables HEC, creates the clouddetect index, and sets
          # KV_MODE=json on the sourcetypes.
          docker run -d --name splunk \
            -p 8088:8088 -p 8089:8089 \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_PASSWORD="$CD_SPLUNK_PASSWORD" \
            -v "$PWD/lab/splunk:/opt/splunk/etc/apps/clouddetect/local:ro" \
            splunk/splunk:9.4.2@sha256:4f798b8dfa75512c5b69b4f162c686e7b194e980559dd40fed78aadc417381be

      - name: Wait for OpenSearch
        shell: bash
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "opensearch ready ($((i * 3))s)"; exit 0
            fi
            sleep 3
          done
          echo "::error::OpenSearch did not become ready in time"
          docker logs opensearch 2>&1 | tail -n 80
          exit 1

      - name: Wait for Splunk
        shell: bash
        run: |
          for i in $(seq 1 84); do
            status="$(docker inspect --format '{{.State.Health.Status}}' splunk 2>/dev/null || echo starting)"
            echo "splunk health: $status ($((i * 5))s)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Splunk did not become healthy in time"
          docker logs splunk 2>&1 | tail -n 150
          exit 1

      - name: Replay every fixture through both engines
        run: uv run pytest -m replay -v

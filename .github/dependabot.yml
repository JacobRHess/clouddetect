version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock). Grouped so routine bumps
  # arrive as one PR a week rather than a flurry.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  # Keep the SHA-pinned GitHub Actions current, so a pin can't quietly rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
